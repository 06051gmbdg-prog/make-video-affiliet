name: Buat video affiliate
description: Satu kalimat berisi nama produk, harga, dan link. Lampirkan foto atau klip produk. Hasilnya sampai 3 video.
title: "Video: "
body:
  - type: input
    id: kalimat
    attributes:
      label: Kalimat produk
      description: Nama produk, harga (tulis dengan Rp), dan link affiliate dalam satu kalimat.
      placeholder: Parfum Hodl Scent Edp 75ml Paket Hemat 2 Botol Rp175.106 https://s.shopee.co.id/xxxx
    validations:
      required: true
  - type: textarea
    id: bahan
    attributes:
      label: Foto dan klip produk
      description: Ketuk kotak ini, lalu lampirkan 3 sampai 8 foto produk. Klip presenter atau UGC boleh ditambahkan (maksimal 10 MB per klip). Urutan lampiran menentukan urutan adegan.
    validations:
      required: false
  - type: input
    id: folder
    attributes:
      label: Folder bahan di repo (opsional)
      description: Isi bila foto atau klip sudah diunggah ke folder di dalam bahan/, misalnya untuk klip lebih dari 10 MB.
      placeholder: bahan/hodl-scent
    validations:
      required: false
  - type: dropdown
    id: varian
    attributes:
      label: Jumlah varian
      description: Tiga varian memakai 3 dari jatah 5 video per hari.
      options:
        - "3"
        - "2"
        - "1"
      default: 0
    validations:
      required: true
  - type: input
    id: suasana
    attributes:
      label: Kata kunci suasana dari Pixabay (opsional)
      description: Klip latar gratis disisipkan di antara fotomu. Hanya suasana, bukan produk. Pakai bahasa Inggris, contoh: car road night
      placeholder: car road night
    validations:
      required: false
  - type: dropdown
    id: suara
    attributes:
      label: Suara narasi
      description: Narasi bahasa Indonesia dibaca otomatis dari nama, harga, dan kalimat pembuka.
      options:
        - Perempuan
        - Laki-laki
        - Tanpa suara
      default: 0
    validations:
      required: true
